name: Lab4 CI

on:
  push:
    paths:
      - "ак 4сем/lab4/**"
      - ".github/workflows/lab4-ci.yml"
  pull_request:
    paths:
      - "ак 4сем/lab4/**"
      - ".github/workflows/lab4-ci.yml"

jobs:
  check-lab4:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "ак 4сем/lab4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml ruff mypy

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test
