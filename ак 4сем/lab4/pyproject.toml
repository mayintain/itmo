[project]
name = "arch-lab4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "SIM102",
    "SIM108",
    "SIM114",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "isa.py",
    "translator.py",
    "machine.py",
    "tests",
]
