name: "m68k stack calculator: 2 3 + == 5"
limit: 2000
memory_size: 0x1000

memory_mapped_io:
  0x80: [50, 32, 51, 32, 43, 10]
  0x84: []

reports:
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [5]